{% extends 'base.html' %}
{% block title %}로그인 — voca海{% endblock %}

{% block content %}
<div class="form-page">
    <h2 class="form-page__title">로그인</h2>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>

        <!-- 이메일 -->
        <div class="form-group">
            <label class="form-label" for="email">이메일</label>
            <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                value="{{ form_data.get('email', '') }}"
                autocomplete="email"
                inputmode="email"
                required
            >
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호 입력"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn btn--primary btn--full">로그인</button>
    </form>

    <p class="form-page__footer">
        계정이 없어요?
        <a href="{{ url_for('auth.register') }}">회원가입</a>
    </p>
</div>
{% endblock %}
