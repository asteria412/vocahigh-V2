{% extends 'base.html' %}
{% block title %}비밀번호 변경 — voca海{% endblock %}

{% block content %}
<div class="form-page">
    <h2 class="form-page__title">비밀번호 변경</h2>

    {% if forced %}
    <div class="wo-hint-card" style="margin-bottom:var(--space-lg);">
        임시 비밀번호로 로그인됐어요. 새 비밀번호를 설정해야 계속 이용할 수 있어요.
    </div>
    {% endif %}

    <p style="color:var(--color-text-muted); font-size:0.85rem; text-align:center; margin-bottom:var(--space-lg);">
        현재 별명: <strong>{{ current_user.nickname }}</strong>
    </p>

    <form method="POST" action="{{ url_for('auth.change_password') }}" novalidate>

        <div class="form-group">
            <label class="form-label" for="current_password">현재 비밀번호</label>
            <input
                class="form-input"
                type="password"
                id="current_password"
                name="current_password"
                placeholder="현재 비밀번호 입력"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="new_password">새 비밀번호</label>
            <input
                class="form-input"
                type="password"
                id="new_password"
                name="new_password"
                placeholder="새 비밀번호 (6자 이상)"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">새 비밀번호 확인</label>
            <input
                class="form-input"
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="새 비밀번호 다시 입력"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" class="btn btn--primary btn--full" style="margin-top:var(--space-md);">변경하기</button>
    </form>

    {% if not forced %}
    <p class="form-page__footer">
        <a href="{{ url_for('main.home') }}">← 홈으로 돌아가기</a>
    </p>
    {% endif %}
</div>
{% endblock %}
