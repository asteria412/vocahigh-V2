{% extends 'base.html' %}
{% block title %}단어장 업로드 — voca海{% endblock %}

{% block content %}
<div class="form-page">
    <h2 class="form-page__title">단어장 업로드</h2>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label class="form-label" for="list_name">
                단어장 이름
                <span class="form-hint">비우면 파일명으로 저장</span>
            </label>
            <input class="form-input" type="text" id="list_name" name="list_name"
                   placeholder="예: HSK 5급 1과">
        </div>

        <!-- 파일 업로드 영역 -->
        <div class="form-group">
            <label class="form-label">파일 선택</label>
            <label class="file-drop" for="file">
                <span class="file-drop__icon">📄</span>
                <span class="file-drop__text">PDF 또는 TXT 파일을 선택해주세요</span>
                <span class="file-drop__hint">최대 16MB</span>
                <input type="file" id="file" name="file" accept=".pdf,.txt"
                       class="file-drop__input" required>
            </label>
            <p id="file-name" class="form-hint" style="margin-top:8px;"></p>
        </div>

        <button type="submit" class="btn btn--primary btn--full">파싱 시작</button>
    </form>

    <p class="form-page__footer">
        <a href="{{ url_for('vocab.index') }}">← 내 단어장으로</a>
    </p>
</div>

{% block extra_scripts %}
<script>
    // 파일 선택 시 파일명 표시
    document.getElementById('file').addEventListener('change', function() {
        const name = this.files[0]?.name || '';
        document.getElementById('file-name').textContent = name ? '선택된 파일: ' + name : '';
    });
</script>
{% endblock %}
{% endblock %}
