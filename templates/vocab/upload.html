{% extends 'base.html' %}
{% block title %}단어장 업로드 — voca海{% endblock %}

{% block content %}
<div class="form-page">
    <h2 class="form-page__title">단어장 업로드</h2>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label class="form-label" for="list_name">
                단어장 이름
                <span class="form-hint">비우면 파일명으로 저장</span>
            </label>
            <input class="form-input" type="text" id="list_name" name="list_name"
                   placeholder="예: HSK 5급 1과">
        </div>

        <!-- 파일 업로드 영역 -->
        <div class="form-group">
            <label class="form-label">파일 선택</label>
            <label class="file-drop" for="file">
                <span class="file-drop__icon">📄</span>
                <span class="file-drop__text">PDF 또는 TXT 파일을 선택해주세요</span>
                <span class="file-drop__hint">최대 16MB</span>
                <input type="file" id="file" name="file" accept=".pdf,.txt"
                       class="file-drop__input" required>
            </label>
            <p id="file-name" class="form-hint" style="margin-top:8px;"></p>
        </div>

        <p class="tutorial-caution">⚠️ 이미지 기반 PDF(스캔본)는 텍스트 인식이 어려울 수 있어요. 텍스트 선택이 되는 PDF를 사용해주세요.</p>

        <button type="submit" class="btn btn--primary btn--full">단어 추출 시작</button>
    </form>

    <p class="form-page__footer">
        <a href="{{ url_for('vocab.index') }}">← 내 단어장으로</a>
    </p>
</div>

{% block extra_scripts %}
<script>
    const fileInput = document.getElementById('file');
    const dropZone = document.querySelector('.file-drop');
    const fileNameEl = document.getElementById('file-name');

    function showFileName(name) {
        fileNameEl.textContent = name ? '선택된 파일: ' + name : '';
    }

    fileInput.addEventListener('change', function() {
        showFileName(this.files[0]?.name || '');
    });

    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.style.borderColor = 'var(--color-primary)';
    });

    dropZone.addEventListener('dragleave', function() {
        this.style.borderColor = '';
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        this.style.borderColor = '';
        const file = e.dataTransfer.files[0];
        if (file) {
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            showFileName(file.name);
        }
    });
</script>
{% endblock %}
{% endblock %}
