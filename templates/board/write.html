{% extends 'base.html' %}
{% block title %}질문하기 — voca海{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">질문하기</h2>
    <a href="{{ url_for('board.list') }}" class="btn--back">← 목록</a>
</div>

<form method="POST" action="{{ url_for('board.write') }}" novalidate>

    <div class="form-group">
        <label class="form-label" for="title">제목</label>
        <input
            class="form-input"
            type="text"
            id="title"
            name="title"
            placeholder="궁금한 점을 간단히 적어주세요"
            value="{{ form_data.get('title', '') }}"
            maxlength="200"
            required
        >
    </div>

    <div class="form-group">
        <label class="form-label" for="content">내용</label>
        <textarea
            class="form-input form-textarea"
            id="content"
            name="content"
            placeholder="어떤 점이 궁금하세요? 중국어 표현, HSK 문법, 단어 뜻 등 자유롭게 질문해주세요."
            rows="8"
            required
        >{{ form_data.get('content', '') }}</textarea>
    </div>

    <div style="display:flex; gap:var(--space-sm); justify-content:flex-end; margin-top:var(--space-lg);">
        <a href="{{ url_for('board.list') }}" class="btn--gray">취소</a>
        <button type="submit" class="btn btn--primary">질문 등록</button>
    </div>
</form>
{% endblock %}
